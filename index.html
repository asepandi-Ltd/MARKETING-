    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection to prevent connection failure in Cloud Run
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof protocols === 'string' && protocols.includes('vite-hmr')) {
              var dummy = {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 3
              };
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter console.error from logging [vite] websocket connection failures
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(item) { return String(item); }).join(' ');
          if (text.indexOf('failed to connect to websocket') !== -1 || text.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // 3. Prevent unhandled rejections / window errors
        window.addEventListener('error', function(e) {
          if (e && (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
